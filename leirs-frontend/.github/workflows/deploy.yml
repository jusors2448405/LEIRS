name: Deploy to HostForge

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: leirs-frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: leirs-frontend
        run: npm ci
      
      - name: Build project
        working-directory: leirs-frontend
        run: npm run build
      
      - name: Deploy to HostForge via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./leirs-frontend/dist/
          server-dir: ./htdocs/
          dangerous-clean-slate: false
